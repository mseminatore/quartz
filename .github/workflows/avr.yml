name: avr

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc

      - name: Configure
        run: |
          cmake -B build_avr \
                -DRTOS_PORT=avr \
                -DCMAKE_TOOLCHAIN_FILE=cmake/avr_atmega328p.cmake

      - name: Build quartz library
        run: cmake --build build_avr --target quartz --parallel

      - name: Verify librtos.a
        run: |
          test -f build_avr/libquartz.a
          ls -l build_avr/libquartz.a
