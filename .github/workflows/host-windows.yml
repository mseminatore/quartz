name: host-windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        run: cmake -B build

      - name: Build (quartz_test only)
        run: cmake --build build --config Debug --target quartz_test --parallel

      - name: Test
        working-directory: build
        run: ctest -C Debug --output-on-failure
