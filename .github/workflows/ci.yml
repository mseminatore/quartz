name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --parallel

      - name: Build (Windows, rtos_test only)
        if: runner.os == 'Windows'
        run: cmake --build build --config Debug --target rtos_test --parallel

      - name: Test (Linux)
        if: runner.os == 'Linux'
        working-directory: build
        run: ctest --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: ctest -C Debug --output-on-failure

  cross:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: avr
            apt: gcc-avr avr-libc
            toolchain: cmake/avr_atmega328p.cmake
            port: avr
            extra_cmake: ""
            artifact: build_avr/librtos.a

          - target: cm4
            apt: gcc-arm-none-eabi
            toolchain: cmake/arm_cm4.cmake
            port: cm4
            extra_cmake: ""
            artifact: build_cm4/librtos.a

          - target: cm4-fpu
            apt: gcc-arm-none-eabi
            toolchain: cmake/arm_cm4.cmake
            port: cm4
            extra_cmake: "-DRTOS_CM4_FPU=1"
            artifact: build_cm4-fpu/librtos.a

          - target: riscv
            apt: gcc-riscv64-unknown-elf
            toolchain: cmake/riscv32_clint.cmake
            port: riscv
            extra_cmake: ""
            artifact: build_riscv/librtos.a
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (${{ matrix.apt }})
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure
        run: |
          cmake -B build_${{ matrix.target }} \
                -DRTOS_PORT=${{ matrix.port }} \
                -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} \
                ${{ matrix.extra_cmake }}

      - name: Build rtos library
        run: cmake --build build_${{ matrix.target }} --target rtos --parallel

      - name: Verify librtos.a exists
        run: |
          test -f ${{ matrix.artifact }} || { echo "Missing ${{ matrix.artifact }}"; exit 1; }
          ls -l ${{ matrix.artifact }}
