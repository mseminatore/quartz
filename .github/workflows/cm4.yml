name: cm4

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Configure
        run: |
          cmake -B build_cm4 \
                -DRTOS_PORT=cm4 \
                -DCMAKE_TOOLCHAIN_FILE=cmake/arm_cm4.cmake

      - name: Build quartz library
        run: cmake --build build_cm4 --target quartz --parallel

      - name: Verify librtos.a
        run: |
          test -f build_cm4/libquartz.a
          ls -l build_cm4/libquartz.a
