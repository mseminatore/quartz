name: cm7

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Configure
        run: |
          cmake -B build_cm7 \
                -DRTOS_PORT=cm7 \
                -DCMAKE_TOOLCHAIN_FILE=cmake/arm_cm7.cmake

      - name: Build quartz library
        run: cmake --build build_cm7 --target quartz --parallel

      - name: Verify librtos.a
        run: |
          test -f build_cm7/libquartz.a
          ls -l build_cm7/libquartz.a
