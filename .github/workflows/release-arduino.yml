name: release-arduino

on:
  push:
    tags:
      - "arduino-v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release-arduino:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create a GitHub Release

    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"        # e.g. arduino-v1.0.0
          VERSION="${TAG#arduino-v}"      # strip prefix  →  1.0.0
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure (stamps rtos_version.h via cmake/version.cmake)
        run: cmake -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Package Arduino library
        run: python3 tools/package_arduino.py --zip QuartzRTOS.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "QuartzRTOS Arduino Library v${{ steps.version.outputs.version }}"
          files: QuartzRTOS.zip
          generate_release_notes: true
