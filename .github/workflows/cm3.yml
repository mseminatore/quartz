name: cm3

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Configure
        run: |
          cmake -B build_cm3 \
                -DRTOS_PORT=cm3 \
                -DCMAKE_TOOLCHAIN_FILE=cmake/arm_cm3.cmake

      - name: Build rtos library
        run: cmake --build build_cm3 --target rtos --parallel

      - name: Verify librtos.a
        run: |
          test -f build_cm3/librtos.a
          ls -l build_cm3/librtos.a
